<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Moss</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <main class="pill" id="pill" data-mood="ready">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 44 44">
          <circle class="track" cx="22" cy="22" r="18.5" />
          <circle class="arc" id="arc" cx="22" cy="22" r="18.5" pathLength="100" />
        </svg>
        <span class="core"></span>
        <span class="mins tabular" id="mins"></span>
      </div>
      <div class="readout">
        <span class="time tabular" id="time" role="timer" aria-live="off">25:00</span>
        <span class="label" id="label">Ready</span>
      </div>
      <div class="tail">
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="controls">
          <button class="icon-btn primary" id="toggle"></button>
          <button class="icon-btn" id="skip"></button>
          <button class="icon-btn" id="expand"></button>
        </div>
      </div>
    </main>
    <script type="module" src="widget.js"></script>
  </body>
</html>
