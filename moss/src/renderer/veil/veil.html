<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Moss · Break</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="veil.css" />
  </head>
  <body>
    <div class="tint" aria-hidden="true"></div>
    <main class="card" id="card">
      <p class="meta"><span id="kicker">Short break</span><span class="time tabular" id="time" role="timer"></span></p>
      <div class="dial">
        <div class="breath" id="breath" aria-hidden="true"></div>
        <p class="breath-label" id="breathLabel"></p>
      </div>
      <h1 class="title" id="title"></h1>
      <p class="tip" id="tip"></p>
      <div class="actions">
        <button class="pill-btn" id="secondary"></button>
        <button class="pill-btn" id="primary"></button>
      </div>
    </main>
    <script type="module" src="veil.js"></script>
  </body>
</html>
