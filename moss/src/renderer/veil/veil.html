<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Moss · Break</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="veil.css" />
  </head>
  <body data-mood="break">
    <div class="tint" aria-hidden="true"></div>
    <main class="card">
      <div class="dial">
        <div class="breath" id="breath" aria-hidden="true"></div>
        <div class="center">
          <p class="kicker" id="kicker">Short break</p>
          <div class="time tabular" id="time" role="timer"></div>
          <p class="title" id="title"></p>
          <p class="breath-label" id="breathLabel" aria-live="polite"></p>
        </div>
      </div>
      <p class="tip" id="tip"></p>
      <div class="actions">
        <button class="pill-btn" id="secondary"></button>
        <button class="pill-btn primary" id="primary"></button>
      </div>
    </main>
    <script type="module" src="veil.js"></script>
  </body>
</html>
